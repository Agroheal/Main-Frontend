services:
  # Main Frontend Application
  - type: web
    name: agroheal-frontend
    runtime: static
    buildCommand: yarn install && yarn web:build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Admin Panel Application
  - type: web
    name: agroheal-admin
    runtime: static
    buildCommand: yarn install && yarn admin:build
    staticPublishPath: ./apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
